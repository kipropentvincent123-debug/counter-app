
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple interactive counter app">
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="counter-card">
    <h1>Counter App</h1>
    <p class="subtitle">Count it your way</p>

    <div id="count" class="count">0</div>

    <div class="buttons">
      <button id="decrease" class="btn minus">− Decrease</button>
      <button id="increase" class="btn plus">+ Increase</button>
    </div>

    <button id="reset" class="reset">Reset Counter</button>
    <p class="hint">Keyboard: + or ↑ to increase, − or ↓ to decrease, R to reset.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
